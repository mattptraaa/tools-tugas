  <!-- Mid-Left Yellow Dot -->
  <circle cx="122" cy="184" r="5" fill="#FFC700" />
  <!-- Bottom-Left Magenta Dot -->
  <circle cx="136" cy="248" r="6.5" fill="#E5127D" />

  <!-- Left Magenta Accent / Flare -->
