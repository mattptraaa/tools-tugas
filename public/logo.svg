  <!-- Nasional (Cyan Bold) -->
  <text x="205" y="247" fill="#00B4D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', Arial, sans-serif" font-size="16.5" font-weight="800" text-anchor="middle" letter-spacing="0.3">
