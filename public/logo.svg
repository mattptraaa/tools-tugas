  <!-- Outer Bottom Magenta Arc -->
  <path d="M 108 226 C 108 270 156 298 205 284 C 236 276 256 254 265 234" fill="none" stroke="#E5127D" stroke-width="4.5" stroke-linecap="round" />

  <!-- Inner Bottom Yellow Arc -->
  <path d="M 134 242 C 146 274 190 282 225 260 C 240 250 250 238 255 228" fill="none" stroke="#FFC700" stroke-width="3.5" stroke-linecap="round" />

  <!-- Inner Bottom Cyan Arc under UT FAMILY -->
