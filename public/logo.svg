    <line x1="16" y1="44" x2="34" y2="43" stroke="#0B2545" stroke-width="0.7" />
    <line x1="17" y1="46" x2="34" y2="45" stroke="#0B2545" stroke-width="0.7" />
    <line x1="42" y1="43" x2="60" y2="44" stroke="#0B2545" stroke-width="0.7" />
    <line x1="42" y1="45" x2="59" y2="46" stroke="#0B2545" stroke-width="0.7" />
