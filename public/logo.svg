  <!-- ================= UNIVERSITAS TERBUKA LOGO ================= -->
  <g transform="translate(182, 162) scale(0.6)">
    <!-- Navy Parabola Dome -->
    <path d="M 10 38 A 28 28 0 0 1 66 38 Z" fill="#0B2545" />
    
    <!-- Horizontal White Slits -->
