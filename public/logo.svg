  <text x="205" y="228" fill="#FFC700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="0.5">
