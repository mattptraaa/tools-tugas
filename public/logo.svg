<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Top Arc Path: KOMUNITAS MAHASISWA UT -->
    <path id="pathTopText" d="M 92 185 A 130 130 0 0 1 268 152" fill="none" />
    
    <!-- Bottom-Left Arc Path: NO ONE, WE ARE FAMILY -->
    <path id="pathBottomText" d="M 86 215 A 140 140 0 0 0 178 300" fill="none" />
  </defs>

  <!-- Top Text: KOMUNITAS MAHASISWA UT (Magenta) -->
  <text fill="#E5127D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="900" letter-spacing="1.2">
    <textPath href="#pathTopText" startOffset="50%" text-anchor="middle">
      KOMUNITAS MAHASISWA UT
    </textPath>
  </text>

  <!-- Bottom Text: NO ONE, WE ARE FAMILY (Cyan) -->
